<!-- templates/posts.html -->
{% extends "base.html" %}

{% block title %}All Posts{% endblock %}

{% block content %}
<h1>All Posts</h1>

{% for post in posts %}
<article class="post">
    <h2><a href="/posts/{{ post.slug }}.html">{{ post.title }}</a></h2>
    <time>{{ post.date }}</time>
    <div>{{ post.content | truncate(300) }}</div>
    <a href="/posts/{{ post.slug }}.html">Read more →</a>
</article>
{% endfor %}

{% if not posts %}
<p>No posts yet. Check back soon!</p>
{% endif %}
{% endblock %}
