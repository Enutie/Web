<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Enutie's Creative Journey{% endblock %}</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --accent-color: #0066cc;
            --secondary-color: #4a4a4a;
            --border-color: #eee;
        }
        
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            background: var(--bg-color);
            color: var(--text-color);
        }
        
        nav {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }
        
        nav a {
            margin-right: 1.5rem;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
        }
        
        nav a:hover {
            text-decoration: underline;
        }
        
        h1, h2, h3 {
            color: var(--text-color);
            line-height: 1.2;
            margin-top: 2rem;
            margin-bottom: 1rem;
        }
        
        .post {
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
        }
        
        .post:last-child {
            border-bottom: none;
        }
        
        .post-date {
            display: block;
            color: var(--secondary-color);
            margin-bottom: 1rem;
        }
        
        .post-excerpt {
            margin-top: 1rem;
        }
        
        .read-more {
            display: inline-block;
            margin-top: 1rem;
            color: var(--accent-color);
            text-decoration: none;
        }
        
        .read-more:hover {
            text-decoration: underline;
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            margin: 2rem 0;
        }
        
        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
            transition: transform 0.2s ease;
        }
        
        .gallery img:hover {
            transform: scale(1.02);
        }
        
        footer {
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
            color: var(--secondary-color);
            text-align: center;
        }
        
        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }
            
            nav a {
                margin-right: 1rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="/">Home</a>
        <a href="/posts.html">Posts</a>
        <a href="#gallery">Gallery</a>
    </nav>
    
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <footer>
        <p>© 2024 Enutie - Creative Journey</p>
    </footer>
</body>
</html>
