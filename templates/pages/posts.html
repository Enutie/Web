{% extends "base.html" %}
{% from "components/_post_card.html" import post_card %}

{% block content %}
    <h1>All Posts</h1>

    <div class="post-grid">
        {% for post in posts %}
            {{ post_card(post) }}
        {% endfor %}
    </div>

    {% if not posts %}
    <p>No posts yet. Check back soon!</p>
    {% endif %}
{% endblock %}
