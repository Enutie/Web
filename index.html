    <title>Enutie — art, code &amp; games, learning in public</title>
    <script>
      // Set the theme before first paint to avoid a flash. An explicit stored
      // choice wins; otherwise the games hall defaults dark and every other page
      // follows the OS colour-scheme preference.
      (function () {
        try {
          var stored = localStorage.getItem('enutie-theme')
          var onGames = location.pathname.indexOf('/games') === 0
          var sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          var theme = stored || (onGames ? 'dark' : sys)
          if (theme === 'dark') document.documentElement.dataset.theme = 'dark'
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
